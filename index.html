<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#050505;color:#ff3158;padding:18px 12px;text-align:center;font-size:28px;font-weight:bold;border-bottom:1px solid #292929}
main{max-width:520px;margin:0 auto;padding:18px}.panel{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
input,button{display:block;width:100%;padding:13px;margin:9px 0;border-radius:8px;border:1px solid #444;font-size:16px}
input{background:#101010;color:white}button{background:#ff3158;border:0;color:white;font-weight:bold;cursor:pointer}button.secondary{background:#383838}
button:disabled{opacity:.6;cursor:wait}.note{color:#c7c7c7;font-size:14px;line-height:1.5}#app{display:none}
video{width:100%;max-height:65vh;background:#000;margin-top:12px;border-radius:8px}.video-card{padding:12px 0;border-top:1px solid #383838}
.video-card p{color:#c7c7c7;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>Snack Video</header>
<main>
<section id="auth" class="panel">
<h2>Create account / Login</h2><p class="note">Email aur kam az kam 6 characters ka password use karo.</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<button id="signup">Create account</button><button id="login" class="secondary">Login</button>
<p id="message" class="note" aria-live="polite"></p>
</section>
<section id="app" class="panel">
<h2>Welcome to Snack Video!</h2><p id="userEmail" class="note"></p>
<h3>Apni video upload karo</h3><input id="videoFile" type="file" accept="video/*">
<button id="uploadButton">Upload video</button><p id="uploadMessage" class="note" aria-live="polite"></p>
<h3>Sab users ki videos</h3><div id="feed"><p class="note">Videos load ho rahi hain...</p></div>
<button id="logout" class="secondary">Logout</button>
<p class="note">Free Cloudinary plan ki limits hoti hain. Sirf apni ya share karne ki ijazat wali videos upload karo.</p>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp,query,orderBy,onSnapshot} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBFJcz2Iwg9ArDO_rN2AeEwFShJD0Q9MwM",
 authDomain:"snack-video-b42cc.firebaseapp.com",
 projectId:"snack-video-b42cc",
 storageBucket:"snack-video-b42cc.firebasestorage.app",
 messagingSenderId:"432494403639",
 appId:"1:432494403639:web:22c61c8d18a53a7666dfb2"
};
// Ye dono values public config hain; API Secret yahan kabhi na likhein.
const CLOUDINARY_CLOUD_NAME="x9fovbqa";
const CLOUDINARY_UPLOAD_PRESET="snack_video_upload";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let stopFeed=null;

$("signup").addEventListener("click",async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){$("message").textContent="Email aur password dono likho.";return;}
 $("signup").disabled=true;$("message").textContent="Account ban raha hai...";
 try{await createUserWithEmailAndPassword(auth,email,password);$("message").textContent="Account ban gaya!";}
 catch(e){$("message").textContent=errorText(e.code);}finally{$("signup").disabled=false;}
});
$("login").addEventListener("click",async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){$("message").textContent="Email aur password dono likho.";return;}
 $("login").disabled=true;$("message").textContent="Login ho raha hai...";
 try{await signInWithEmailAndPassword(auth,email,password);$("message").textContent="Login successful!";}
 catch(e){$("message").textContent=errorText(e.code);}finally{$("login").disabled=false;}
});
onAuthStateChanged(auth,user=>{
 $("auth").style.display=user?"none":"block";$("app").style.display=user?"block":"none";
 $("userEmail").textContent=user?"Logged in: "+user.email:"";
 if(stopFeed){stopFeed();stopFeed=null;}if(user)loadFeed();
});

$("uploadButton").addEventListener("click",async()=>{
 const user=auth.currentUser,file=$("videoFile").files[0];
 if(!user){$("uploadMessage").textContent="Pehle login karo.";return;}
 if(!file){$("uploadMessage").textContent="Pehle video select karo.";return;}
 if(!file.type.startsWith("video/")){$("uploadMessage").textContent="Sirf video select karo.";return;}
 $("uploadButton").disabled=true;$("uploadMessage").textContent="Video upload ho rahi hai...";
 try{
  const data=new FormData();data.append("file",file);data.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);
  const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`,{method:"POST",body:data});
  const result=await response.json();if(!response.ok)throw new Error(result.error?.message||"Cloudinary upload error");
  await addDoc(collection(db,"videos"),{videoUrl:result.secure_url,publicId:result.public_id,fileName:file.name,ownerUid:user.uid,ownerEmail:user.email||"User",createdAt:serverTimestamp()});
  $("uploadMessage").textContent="Video upload ho gayi!";$("videoFile").value="";
 }catch(e){console.error(e);$("uploadMessage").textContent="Upload error: "+e.message+" . Firestore database/rules bhi set hone chahiye.";}
 finally{$("uploadButton").disabled=false;}
});
function loadFeed(){
 $("feed").innerHTML='<p class="note">Videos load ho rahi hain...</p>';
 const q=query(collection(db,"videos"),orderBy("createdAt","desc"));
 stopFeed=onSnapshot(q,snap=>{
  $("feed").innerHTML="";
  if(snap.empty){$("feed").innerHTML='<p class="note">Abhi koi video upload nahi hui.</p>';return;}
  snap.forEach(doc=>{
   const v=doc.data();if(!v.videoUrl)return;
   const card=document.createElement("div");card.className="video-card";
   const player=document.createElement("video");player.controls=true;player.playsInline=true;player.preload="metadata";player.src=v.videoUrl;
   const caption=document.createElement("p");caption.textContent="Uploaded by: "+(v.ownerEmail||"Snack Video user");
   card.append(player,caption);$("feed").append(card);
  });
 },err=>{$("feed").innerHTML='<p class="note">Feed nahi khuli. Firestore database/rules check karo.</p>';console.error(err);});
}
$("logout").addEventListener("click",async()=>{if(stopFeed){stopFeed();stopFeed=null;}await signOut(auth);$("videoFile").value="";});
function errorText(code){const m={"auth/email-already-in-use":"Is email ka account pehle se hai. Login karo.","auth/invalid-email":"Email address theek likho.","auth/weak-password":"Password kam az kam 6 characters ka hona chahiye.","auth/invalid-credential":"Email ya password ghalat hai.","auth/network-request-failed":"Internet check karo."};return m[code]||"Error: "+code;}
</script>
</body></html>
