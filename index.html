<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snack Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font:15px Arial,sans-serif}header{position:sticky;top:0;background:#111;z-index:5;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}h1{font-size:21px;margin:0;color:#ff3158}button{border:0;border-radius:9px;padding:10px 13px;background:#ff3158;color:white;font-weight:bold;margin:3px;cursor:pointer}button.alt{background:#333}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #555;background:#181818;color:white}main{max-width:620px;margin:auto;padding:12px}.panel{background:#151515;padding:14px;border-radius:12px;margin:12px 0}.hidden{display:none!important}.muted{color:#aaa;font-size:13px}.feed{height:calc(100dvh - 90px);overflow-y:auto;scroll-snap-type:y mandatory}.post{height:calc(100dvh - 100px);min-height:480px;position:relative;scroll-snap-align:start;background:#000;margin-bottom:12px;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden}.post video{width:100%;height:100%;object-fit:contain}.overlay{position:absolute;bottom:12px;left:12px;right:70px;text-shadow:0 1px 4px #000}.actions{position:absolute;right:8px;bottom:18px;display:flex;flex-direction:column;align-items:center}.actions button{background:#222d;border:1px solid #666}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav button{flex:1}.msg{color:#ffd36b;min-height:20px}
</style></head><body>
<header><h1>Snack Video</h1><span id="who" class="muted">Not logged in</span></header>
<main>
<section id="auth" class="panel"><h2>Create account / Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><button id="signup">Create account</button><button id="login" class="alt">Login</button><p id="authMsg" class="msg"></p></section>
<section id="app" class="hidden">
<div class="nav"><button data-tab="feed">Feed</button><button data-tab="upload">Upload</button><button data-tab="profile">Profile</button><button data-tab="saved">Saved</button><button data-tab="people">Find users</button><button data-tab="chat">Messages</button><button id="logout" class="alt">Logout</button></div>
<section id="feed" class="tab"><p class="muted">Swipe up/down to change videos. Auto-play follows your setting.</p><div id="videos" class="feed"></div></section>
<section id="upload" class="tab hidden panel"><h2>Upload video</h2><input id="file" type="file" accept="video/*"><textarea id="caption" maxlength="300" placeholder="Caption and #hashtags"></textarea><button id="uploadBtn">Upload</button><p id="uploadMsg" class="msg"></p><video id="preview" controls playsinline style="width:100%;max-height:260px" class="hidden"></video></section>
<section id="profile" class="tab hidden panel"><h2>Your profile</h2><input id="username" maxlength="30" placeholder="Username"><textarea id="bio" maxlength="160" placeholder="Bio"></textarea><button id="saveProfile">Save profile</button><label><input id="autoplay" type="checkbox" checked style="width:auto"> Auto Play ON</label><p id="profileMsg" class="msg"></p><h3>Your videos</h3><div id="myVideos"></div></section>
<section id="saved" class="tab hidden panel"><h2>Saved videos</h2><div id="savedVideos"></div></section>
<section id="people" class="tab hidden panel"><h2>Search users</h2><input id="searchUser" placeholder="Search username"><button id="searchBtn">Search</button><div id="peopleResults"></div></section>
<section id="chat" class="tab hidden panel"><h2>Messages (text)</h2><input id="chatTo" placeholder="Recipient user UID"><textarea id="chatText" placeholder="Write a message"></textarea><button id="sendMsg">Send</button><p id="chatMsg" class="msg"></p><div id="messages"></div></section>
</section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{getFirestore,collection,addDoc,doc,setDoc,getDoc,getDocs,deleteDoc,updateDoc,query,where,orderBy,onSnapshot,serverTimestamp,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBFJcz2Iwg9ArDO_rDO_EwFShJD0Q9MwM",authDomain:"snack-video-b42cc.firebaseapp.com",projectId:"snack-video-b42cc",storageBucket:"snack-video-b42cc.firebasestorage.app",messagingSenderId:"432494403639",appId:"1:432494403639:web:22c61c8d18a53a7666dfb2"};
const CLOUD="x9fovbqa",PRESET="snack_video_upload",app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let me=null,stop=null,allVideos=[],current=0;
const say=(id,t)=>$(id).textContent=t;
$("signup").onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);say("authMsg","Account ban gaya!")}catch(e){say("authMsg",e.message)}};
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);say("authMsg","Login ho gaya!")}catch(e){say("authMsg",e.message)}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{me=u;$("auth").classList.toggle("hidden",!!u);$("app").classList.toggle("hidden",!u);$("who").textContent=u?u.email:"Not logged in";if(stop){stop();stop=null}if(u){await loadProfile();loadFeed()}});
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden");if(b.dataset.tab==="saved")loadSaved();if(b.dataset.tab==="profile")loadMine()});
async function loadProfile(){let s=await getDoc(doc(db,"profiles",me.uid)),d=s.exists()?s.data():{};$("username").value=d.username||me.email.split("@")[0];$("bio").value=d.bio||"";$("autoplay").checked=d.autoplay!==false}
$("saveProfile").onclick=async()=>{await setDoc(doc(db,"profiles",me.uid),{uid:me.uid,username:$("username").value.trim(),bio:$("bio").value.trim(),autoplay:$("autoplay").checked},{merge:true});say("profileMsg","Profile save ho gayi")};
$("file").onchange=()=>{let f=$("file").files[0];if(f){$("preview").src=URL.createObjectURL(f);$("preview").classList.remove("hidden")}};
$("uploadBtn").onclick=async()=>{let f=$("file").files[0];if(!f||!f.type.startsWith("video/"))return say("uploadMsg","Video select karo");$("uploadBtn").disabled=true;say("uploadMsg","Upload ho rahi hai...");
try{let form=new FormData();form.append("file",f);form.append("upload_preset",PRESET);let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`,{method:"POST",body:form}),x=await r.json();if(!r.ok)throw Error(x.error?.message||"Upload error");await addDoc(collection(db,"videos"),{videoUrl:x.secure_url,publicId:x.public_id,ownerUid:me.uid,caption:$("caption").value,createdAt:serverTimestamp(),likes:[],savedBy:[]});say("uploadMsg","Video upload ho gayi");$("file").value="";$("caption").value="";$("preview").classList.add("hidden")}catch(e){say("uploadMsg",e.message)}finally{$("uploadBtn").disabled=false}};
function loadFeed(){if(stop)stop();stop=onSnapshot(query(collection(db,"videos"),orderBy("createdAt","desc")),s=>{allVideos=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed() },e=>{$("videos").textContent=e.message})}
function renderFeed(){let box=$("videos");box.innerHTML="";allVideos.forEach((v,i)=>{let p=document.createElement("article");p.className="post";let video=document.createElement("video");video.src=v.videoUrl;video.loop=true;video.playsInline=true;video.muted=false;video.preload="metadata";let ov=document.createElement("div");ov.className="overlay";ov.textContent=(v.caption||"")+" · "+(v.ownerUid===me.uid?"You":"Snack user");let a=document.createElement("div");a.className="actions";let like=document.createElement("button");like.textContent="❤️ "+(v.likes||[]).length;like.onclick=async()=>updateDoc(doc(db,"videos",v.id),{likes:(v.likes||[]).includes(me.uid)?arrayRemove(me.uid):arrayUnion(me.uid)});let comment=document.createElement("button");comment.textContent="Comment";comment.onclick=async()=>{let t=prompt("Comment likho");if(t)await addDoc(collection(db,"videos",v.id,"comments"),{uid:me.uid,text:t,createdAt:serverTimestamp()})};let save=document.createElement("button");save.textContent=(v.savedBy||[]).includes(me.uid)?"Saved":"Save";save.onclick=()=>updateDoc(doc(db,"videos",v.id),{savedBy:(v.savedBy||[]).includes(me.uid)?arrayRemove(me.uid):arrayUnion(me.uid)});let share=document.createElement("button");share.textContent="Share";share.onclick=()=>navigator.share?navigator.share({url:v.videoUrl,title:"Snack Video"}):navigator.clipboard.writeText(v.videoUrl);a.append(like,comment,save,share);if(v.ownerUid===me.uid){let del=document.createElement("button");del.textContent="Delete";del.onclick=async()=>{if(confirm("Video post delete karni hai?"))await deleteDoc(doc(db,"videos",v.id))};a.append(del)}p.append(video,ov,a);box.append(p)});
let obs=new IntersectionObserver(entries=>entries.forEach(e=>{let v=e.target.querySelector("video");if(e.isIntersecting){if($("autoplay").checked)v.play().catch(()=>{})}else v.pause()}),{threshold:.65});box.querySelectorAll(".post").forEach(p=>obs.observe(p))}
async function loadMine(){let q=await getDocs(query(collection(db,"videos"),where("ownerUid","==",me.uid)));$("myVideos").textContent=q.size+" videos"}
async function loadSaved(){let q=await getDocs(collection(db,"videos"));$("savedVideos").innerHTML="";q.forEach(d=>{let v=d.data();if((v.savedBy||[]).includes(me.uid)){let p=document.createElement("p");p.textContent=v.caption||"Saved video";$("savedVideos").append(p)}})}
$("searchBtn").onclick=async()=>{let q=await getDocs(collection(db,"profiles"));$("peopleResults").innerHTML="";q.forEach(d=>{let x=d.data();if((x.username||"").toLowerCase().includes($("searchUser").value.toLowerCase())){let p=document.createElement("p");p.textContent=(x.username||"User")+" · "+d.id;$("peopleResults").append(p)}})};
$("sendMsg").onclick=async()=>{let to=$("chatTo").value.trim(),t=$("chatText").value.trim();if(!to||!t)return say("chatMsg","UID aur message likho");await addDoc(collection(db,"messages"),{from:me.uid,to,text:t,createdAt:serverTimestamp()});$("chatText").value="";say("chatMsg","Message send ho gaya")};
</script></body></html>
